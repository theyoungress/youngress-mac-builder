name: VANTA VOX macOS

# Builds VANTA VOX (a JUCE 8 + CMake project) for macOS on GitHub's free public-repo Mac runners, like
# the other *-mac.yml here: the private source comes in with a read-only deploy key, all output goes
# to a log in a private draft release, and the finished package is a private draft too.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source commit or branch"
        default: main

permissions:
  contents: write

jobs:
  vantavox:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: theyoungress/vantavox
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.VANTAVOX_SOURCE_KEY }}
          persist-credentials: false
          path: src

      - name: Build, test (DSP, host, editor pictures), sign, validate (auval) and package
        working-directory: src
        timeout-minutes: 70
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build.log"; : > "$log"
          phase() { echo "== $1" | tee -a "$log"; }
          quiet() { "$@" >> "$log" 2>&1; }
          phase configure
          quiet cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          phase build
          quiet cmake --build build-macos --config Release --parallel 4 --target VantaVox_VST3 VantaVox_AU VantaVoxCheck_VST3 VVTests VVHostTest VVSnapshot
          art=build-macos/VantaVox_artefacts/Release
          vst3="$art/VST3/VANTA VOX.vst3"; au="$art/AU/VANTA VOX.component"; check="build-macos/VantaVoxCheck_artefacts/Release/VST3/VANTA VOX.vst3"
          phase "DSP and state checks"
          quiet build-macos/VVTests_artefacts/Release/VVTests
          phase "host test: the test build activated and locked (JUCE's VST3 host: audio, latency, state, automation, editor)"
          quiet build-macos/VVHostTest_artefacts/Release/VVHostTest "$check"
          quiet build-macos/VVHostTest_artefacts/Release/VVHostTest "$check" --locked
          phase "editor pictures as the Mac draws them"
          shots="$RUNNER_TEMP/shots"; mkdir -p "$shots"; snap=build-macos/VVSnapshot_artefacts/Release/VVSnapshot
          quiet "$snap" "$shots/1-advanced-dynamics.png" --preset "Modern Trap Lead" --module 1
          quiet "$snap" "$shots/2-simple.png" --preset "Modern Trap Lead" --mode 0
          quiet "$snap" "$shots/3-tune-2x.png" --preset "Modern Trap Lead" --module 0 --scale 2
          quiet "$snap" "$shots/4-help.png" --preset "Modern Trap Lead" --mode 2 --strip 1
          quiet "$snap" "$shots/5-not-activated.png" --preset "Modern Trap Lead" --module 1 --locked
          phase "check bundles, ad-hoc sign"
          for b in "$vst3" "$au"; do
            bin="$b/Contents/MacOS/VANTA VOX"
            archs=$(lipo -archs "$bin"); echo "$b: $archs" >> "$log"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
            if grep -q VV_TEST_UNLICENSED "$bin"; then echo "the test switch is in the shipped plug-in" >> "$log"; exit 1; fi
            quiet codesign --force --sign - "$b"
            quiet codesign --verify --strict "$b"
          done
          nm -gU "$vst3/Contents/MacOS/VANTA VOX" > "$RUNNER_TEMP/exports.txt"   # (grep -q on a pipe trips pipefail)
          for s in _GetPluginFactory _bundleEntry _bundleExit; do grep -q "$s" "$RUNNER_TEMP/exports.txt"; done
          phase auval
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          quiet ditto "$au" ~/Library/Audio/Plug-Ins/Components/"VANTA VOX.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Vvox Apho > "$RUNNER_TEMP/auval.txt" 2>&1 || true
          cat "$RUNNER_TEMP/auval.txt" >> "$log"
          grep -q "AU VALIDATION SUCCEEDED" "$RUNNER_TEMP/auval.txt"
          phase package
          version=$(sed -nE 's/^project\(VantaVox VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          mkdir -p "pkg/VANTA VOX"
          ditto "$vst3" "pkg/VANTA VOX/VANTA VOX.vst3"
          ditto "$au" "pkg/VANTA VOX/VANTA VOX.component"
          cp release/LICENSE.txt release/THIRD-PARTY-NOTICES.txt "release/Install on Mac.txt" "pkg/VANTA VOX/"
          ditto -c -k --sequesterRsrc --keepParent "pkg/VANTA VOX" "$RUNNER_TEMP/VANTAVOX-$version-Mac.zip"
          ls -l "$RUNNER_TEMP/VANTAVOX-$version-Mac.zip" >> "$log"
          [ "$(stat -f%z "$RUNNER_TEMP/VANTAVOX-$version-Mac.zip")" -lt 50000000 ]   # the store's per-file upload limit
          phase "done: VANTA VOX $version"

      - name: Stage the package, editor pictures and log as a private draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP/build.log")
          for f in "$RUNNER_TEMP"/VANTAVOX-*-Mac.zip; do [ -f "$f" ] && files+=("$f"); done
          if [ -d "$RUNNER_TEMP/shots" ]; then (cd "$RUNNER_TEMP" && zip -q -r editor-pictures.zip shots) && files+=("$RUNNER_TEMP/editor-pictures.zip"); fi
          gh release create "vantavox-mac-${{ github.run_id }}" --draft --title "VANTA VOX macOS (run ${{ github.run_id }})" \
            --notes "Job status: ${{ job.status }}. Universal VST3 + AU, ad-hoc signed." "${files[@]}" -R "$GITHUB_REPOSITORY"
