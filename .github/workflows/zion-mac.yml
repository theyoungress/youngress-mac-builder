name: ZION macOS

# Builds ZION for macOS on GitHub's free public-repo Mac runners, like air-mac.yml: the private
# source comes in with a read-only deploy key, all output goes to a log in a private draft release,
# and the finished package is a private draft too.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source commit or branch"
        default: main

permissions:
  contents: write

jobs:
  zion:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: theyoungress/zion
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.ZION_SOURCE_KEY }}
          persist-credentials: false
          path: src

      - name: Build, test, sign, validate (auval) and package
        working-directory: src
        timeout-minutes: 35
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build.log"; : > "$log"
          phase() { echo "== $1" | tee -a "$log"; }
          quiet() { "$@" >> "$log" 2>&1; }
          phase configure
          quiet cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          phase build
          quiet cmake --build build-macos --config Release --parallel 4
          phase "engine test (decay times, levels, Types, Halo, Gate, Mono Lows, sidechain, every rate, CPU)"
          quiet build-macos/EngineTest
          phase "adapter test (parameters, engine-exact audio, sidechain, state, editor clicks and pictures)"
          mkdir -p "$RUNNER_TEMP/shots"
          quiet build-macos/PortableTest "$RUNNER_TEMP/shots"
          phase "check bundles, ad-hoc sign"
          vst3=build-macos/macOS/ZION.vst3
          au="$(find build-macos -type d -name 'ZION.component' | head -1)"
          for b in "$vst3" "$au"; do
            archs=$(lipo -archs "$b/Contents/MacOS/ZION"); echo "$b: $archs" >> "$log"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
            quiet codesign --force --sign - "$b"
            quiet codesign --verify --strict "$b"
          done
          nm -gU "$vst3/Contents/MacOS/ZION" > "$RUNNER_TEMP/exports.txt"   # (grep -q on a pipe trips pipefail)
          for s in _GetPluginFactory _bundleEntry _bundleExit; do grep -q "$s" "$RUNNER_TEMP/exports.txt"; done
          phase auval
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          quiet ditto "$au" ~/Library/Audio/Plug-Ins/Components/ZION.component
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx YZio YRes > "$RUNNER_TEMP/auval.txt" 2>&1 || true
          cat "$RUNNER_TEMP/auval.txt" >> "$log"
          grep -q "AU VALIDATION SUCCEEDED" "$RUNNER_TEMP/auval.txt"
          phase package
          version=$(sed -nE 's/^#define ZION_VERSION "([0-9.]+)".*/\1/p' Source/Version.h)
          mkdir -p pkg/ZION
          ditto "$vst3" pkg/ZION/ZION.vst3
          ditto "$au" pkg/ZION/ZION.component
          cp release/LICENSE.txt release/THIRD-PARTY-NOTICES.txt "release/Install on Mac.txt" pkg/ZION/
          ditto -c -k --sequesterRsrc --keepParent pkg/ZION "$RUNNER_TEMP/ZION-$version-Mac.zip"
          [ "$(stat -f%z "$RUNNER_TEMP/ZION-$version-Mac.zip")" -lt 50000000 ]   # the store's per-file upload limit
          phase "done: ZION $version"

      - name: Stage the package, editor pictures and log as a private draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP/build.log")
          for f in "$RUNNER_TEMP"/ZION-*-Mac.zip "$RUNNER_TEMP"/shots/*.png; do [ -f "$f" ] && files+=("$f"); done
          gh release create "zion-mac-${{ github.run_id }}" --draft --title "ZION macOS (run ${{ github.run_id }})" \
            --notes "Job status: ${{ job.status }}. Universal VST3 + AU, ad-hoc signed." "${files[@]}" -R "$GITHUB_REPOSITORY"
