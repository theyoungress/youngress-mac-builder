name: WAVY macOS

# Builds WAVY (a JUCE 8 + CMake project) for macOS on GitHub's free public-repo Mac runners, like
# the other *-mac.yml here: the private source comes in with a read-only deploy key, all output goes
# to a log in a private draft release, and the finished package is a private draft too.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Source commit or branch"
        default: main

permissions:
  contents: write

jobs:
  wavy:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          repository: theyoungress/wavy
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.WAVY_SOURCE_KEY }}
          persist-credentials: false
          path: src

      - name: Build, test (listeners, host, editor pictures), sign, validate (auval) and package
        working-directory: src
        timeout-minutes: 70
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/build.log"; : > "$log"
          phase() { echo "== $1" | tee -a "$log"; }
          quiet() { "$@" >> "$log" 2>&1; }
          phase configure
          quiet cmake -S . -B build-macos -DCMAKE_BUILD_TYPE=Release
          phase build
          quiet cmake --build build-macos --config Release --parallel 4 --target Wavy_VST3 Wavy_AU WavyTests WavyHostTest WavySnapshot
          art=build-macos/Wavy_artefacts/Release
          vst3="$art/VST3/WAVY.vst3"; au="$art/AU/WAVY.component"
          phase "listeners, settings, MIDI file, background job and state (also writes the made-up audio)"
          audio="$RUNNER_TEMP/audio"
          quiet build-macos/WavyTests_artefacts/Release/WavyTests --write "$audio"
          phase "host test (JUCE's VST3 host: scan, buses, audio through untouched, state, rates, editor)"
          quiet build-macos/WavyHostTest_artefacts/Release/WavyHostTest "$vst3"
          phase "editor pictures as the Mac draws them, and the keys pressed"
          shots="$RUNNER_TEMP/shots"; mkdir -p "$shots"; snap=build-macos/WavySnapshot_artefacts/Release/WavySnapshot
          quiet "$snap" "$shots/1-empty-100.png"
          "$snap" "$shots/2-melody-200.png" --size 2 --file "$audio/melody.wav" --bpm 120 > "$RUNNER_TEMP/melody.txt"
          cat "$RUNNER_TEMP/melody.txt" >> "$log"
          grep -q "notes = 8," "$RUNNER_TEMP/melody.txt"
          "$snap" "$shots/3-drums-pressed-125.png" --size 1.25 --file "$audio/drums.wav" --bpm 120 --click "355 288; 216 352; 662 344" > "$RUNNER_TEMP/pressed.txt"
          cat "$RUNNER_TEMP/pressed.txt" >> "$log"
          for want in "Mode = Drums" "Quantize = 1/16" "Velocity = Fixed"; do grep -q "$want" "$RUNNER_TEMP/pressed.txt"; done
          quiet "$snap" "$shots/4-chords-075.png" --size 0.75 --file "$audio/chords.wav" --set mode=2
          phase "check bundles, ad-hoc sign"
          for b in "$vst3" "$au"; do
            bin="$b/Contents/MacOS/WAVY"
            archs=$(lipo -archs "$bin"); echo "$b: $archs" >> "$log"
            [[ "$archs" == *x86_64* && "$archs" == *arm64* ]]
            quiet codesign --force --sign - "$b"
            quiet codesign --verify --strict "$b"
          done
          nm -gU "$vst3/Contents/MacOS/WAVY" > "$RUNNER_TEMP/exports.txt"   # (grep -q on a pipe trips pipefail)
          for s in _GetPluginFactory _bundleEntry _bundleExit; do grep -q "$s" "$RUNNER_TEMP/exports.txt"; done
          phase auval
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          quiet ditto "$au" ~/Library/Audio/Plug-Ins/Components/"WAVY.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Wavy Apho > "$RUNNER_TEMP/auval.txt" 2>&1 || true
          cat "$RUNNER_TEMP/auval.txt" >> "$log"
          grep -q "AU VALIDATION SUCCEEDED" "$RUNNER_TEMP/auval.txt"
          phase package
          version=$(sed -nE 's/^project\(Wavy VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)
          mkdir -p "pkg/WAVY"
          ditto "$vst3" "pkg/WAVY/WAVY.vst3"
          ditto "$au" "pkg/WAVY/WAVY.component"
          cp release/LICENSE.txt release/THIRD-PARTY-NOTICES.txt "release/Install on Mac.txt" "pkg/WAVY/"
          ditto -c -k --sequesterRsrc --keepParent "pkg/WAVY" "$RUNNER_TEMP/WAVY-$version-Mac.zip"
          ls -l "$RUNNER_TEMP/WAVY-$version-Mac.zip" >> "$log"
          [ "$(stat -f%z "$RUNNER_TEMP/WAVY-$version-Mac.zip")" -lt 50000000 ]   # the store's per-file upload limit
          phase "done: WAVY $version"

      - name: Stage the package, editor pictures and log as a private draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=("$RUNNER_TEMP/build.log")
          for f in "$RUNNER_TEMP"/WAVY-*-Mac.zip; do [ -f "$f" ] && files+=("$f"); done
          if [ -d "$RUNNER_TEMP/shots" ]; then (cd "$RUNNER_TEMP" && zip -q -r editor-pictures.zip shots) && files+=("$RUNNER_TEMP/editor-pictures.zip"); fi
          gh release create "wavy-mac-${{ github.run_id }}" --draft --title "WAVY macOS (run ${{ github.run_id }})" \
            --notes "Job status: ${{ job.status }}. Universal VST3 + AU, ad-hoc signed." "${files[@]}" -R "$GITHUB_REPOSITORY"
